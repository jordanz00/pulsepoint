name: Quake OS daily cycle

on:
  schedule:
    # 07:00 UTC daily — schedule.every().day.do(orchestrator.runDailyCycle)
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  daily-cycle:
    name: Run due Quake OS jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run due scheduled jobs
        run: pnpm quake:os:scheduler
      - name: Upload scheduler state
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quake-os-scheduler-state-${{ github.run_id }}
          path: quake-os/memory/scheduler-state.json
          if-no-files-found: ignore
