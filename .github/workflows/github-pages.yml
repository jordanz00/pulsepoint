# Static marketing + interactive demo for GitHub Pages (no Vercel, no Node server).
# Live URL (public repo): https://jordanz00.github.io/pulsepoint/
name: Deploy GitHub Pages demo

on:
  push:
    branches: [main]
    paths:
      - "gh-pages-site/**"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
