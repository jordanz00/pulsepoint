name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./prisma/ci.db
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      CLERK_SECRET_KEY: sk_test_ci_placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Prepare SQLite database
        run: bash scripts/ci-db-prepare.sh

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm security:audit

      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"

  # E2E smoke runs in parallel via .github/workflows/e2e.yml (demo wedge + Playwright)
