name: Quake OS gates

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 12:00 UTC — continuous improvement signal
    - cron: "0 12 * * 1"
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "components/**"
      - "prisma/**"
      - "docs/PRODUCT-CLAIMS.md"
      - "scripts/ten-member-leak-checks.sh"
      - "quake-os/**"
      - "data/quake-os/**"

jobs:
  quake:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/ci.db
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      CLERK_SECRET_KEY: sk_test_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/quake-gates.sh
