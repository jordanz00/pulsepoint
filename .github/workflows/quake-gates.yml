name: Quake OS gates

on:
  workflow_dispatch:
  # Schedule removed — weekly Quake OS automation already runs gates.
  # Scheduled failures were emailing SQLITE_BUSY flakes; run on PR + manual only.
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "components/**"
      - "prisma/**"
      - "docs/PRODUCT-CLAIMS.md"
      - "scripts/ten-member-leak-checks.sh"
      - "scripts/ci-db-prepare.sh"
      - "scripts/quake-gates.sh"
      - "quake-os/**"
      - "data/quake-os/**"
      - "tests/**"
      - "vitest.config.ts"

jobs:
  quake:
    runs-on: ubuntu-latest
    # Prisma schema provider is sqlite — do not attach Postgres (adapter mismatch).
    env:
      DATABASE_URL: file:./prisma/ci.db
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
      CLERK_SECRET_KEY: sk_test_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/quake-gates.sh
