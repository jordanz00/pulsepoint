# Local Postgres for PulsePoint development (optional; use Neon in production)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: pulsepoint
      POSTGRES_PASSWORD: pulsepoint
      POSTGRES_DB: pulsepoint
    volumes:
      - pulsepoint_pg:/var/lib/postgresql/data

volumes:
  pulsepoint_pg:
