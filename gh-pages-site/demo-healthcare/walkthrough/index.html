<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="pp-base" content="/pulsepoint/" />
  <title>Guided walkthrough — Sterling Healthcare demo</title>
  <link rel="stylesheet" href="../../assets/site.css" />
  <script src="../../assets/site.js" defer></script>
</head>
<body>
  <div class="pc-demo-banner">
    Walkthrough (static) · <a href="#" data-pp-exit-demo>Exit demo</a>
  </div>
  <main class="pc-section" style="max-width:48rem;margin:0 auto;">
    <div class="pc-card">
      <h1 style="font-family:var(--font-display);color:var(--pc-accent);margin:0 0 0.5rem;">Guided walkthrough</h1>
      <p style="color:var(--pc-muted);">12 steps · Protech-style AMS tour. Full talk track runs in the local app.</p>
      <ol id="pp-steps" style="margin:1.5rem 0;padding-left:1.25rem;line-height:1.8;"></ol>
      <p style="margin-top:1.5rem;">
        <button type="button" class="pc-btn-primary" id="pp-open-module">Open current step (local app)</button>
      </p>
      <p class="pc-note" style="margin-top:1.5rem;">
        Database-backed walkthrough: <code>pnpm demo:setup &amp;&amp; pnpm dev</code> →
        <a data-pp-href="demo/">Enter demo</a> → <strong>Start guided walkthrough</strong>
      </p>
    </div>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (!window.PulsePointSite.requireDemo()) return;
      var steps = [
        { t: "Overview & product suite", s: "live" },
        { t: "MemberCore directory", s: "live" },
        { t: "Import staging", s: "live" },
        { t: "Events & registration", s: "live" },
        { t: "Exception queue", s: "live" },
        { t: "Learn (CE)", s: "alpha" },
        { t: "Giving", s: "alpha" },
        { t: "Commerce", s: "alpha" },
        { t: "Engage", s: "alpha" },
        { t: "Insights", s: "alpha" },
        { t: "Committees preview", s: "partial" },
        { t: "Member portal", s: "live" }
      ];
      var idx = 0;
      var list = document.getElementById("pp-steps");
      steps.forEach(function (st, i) {
        var li = document.createElement("li");
        li.innerHTML = "<strong>" + (i + 1) + ".</strong> " + st.t +
          ' <span class="pc-badge pc-badge-' + (st.s === "alpha" ? "alpha" : st.s === "live" ? "live" : "roadmap") + '">' + st.s + "</span>";
        li.style.cursor = "pointer";
        li.onclick = function () { idx = i; highlight(); };
        list.appendChild(li);
      });
      function highlight() {
        Array.prototype.forEach.call(list.children, function (li, i) {
          li.style.fontWeight = i === idx ? "700" : "";
        });
      }
      highlight();
      document.getElementById("pp-open-module").onclick = function () {
        alert("Run locally: http://localhost:3000/demo-healthcare/walkthrough?step=" + idx);
      };
    });
  </script>
</body>
</html>
