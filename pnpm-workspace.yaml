packages:
  - "packages/*"

allowBuilds:
  '@clerk/shared': set this to true or false
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': set this to true or false
  better-sqlite3: true
  esbuild: set this to true or false
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
