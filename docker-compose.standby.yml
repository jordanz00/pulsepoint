# Warm standby — run alongside Vercel for failover drills
# Usage: cp .env.standby.example .env.standby && edit secrets
#        docker compose -f docker-compose.standby.yml up -d --build

services:
  pulsepoint:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.standby
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
